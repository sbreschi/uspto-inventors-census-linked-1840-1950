# Reproducible environment for this project.
#
# faiss-gpu 1.12.0 is only on the `defaults` (pkgs/main) channel, so `defaults`
# is listed first. If your conda is configured with `channel_priority: strict`
# and conda-forge ahead of defaults, the channel order below overrides it for
# this solve. CPU-only? swap `faiss-gpu` -> `faiss-cpu`.
name: ipums_match
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.10
  - faiss-gpu=1.12.0
  - pip
  - pip:
      - pandas==2.3.3
      - numpy==2.2.5
      - pyarrow==23.0.1
      - polars==1.41.2
      - scikit-learn==1.7.2
      - xgboost==3.2.0
      - rapidfuzz==3.14.3
      - metaphone==0.6
      - Unidecode==1.4.0
      # Optional add-on stages (relatedness + ml_model audit). torch is pinned to
      # 2.4.1 -- the last default wheel whose CUDA build still ships Pascal (sm_60/
      # sm_61) kernels; newer wheels drop them and cannot run on a Tesla P40. On
      # Ampere+ or CPU-only hosts any recent torch works.
      - openpyxl==3.1.5
      - matplotlib==3.10.9
      - nltk==3.9.4
      - torch==2.4.1
      - sentence-transformers==5.6.0
